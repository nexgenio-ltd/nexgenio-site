name: Build & Deploy Blog

on:
  repository_dispatch:
    types: [blog-publish]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install blog build dependencies
        working-directory: scripts
        run: npm ci

      - name: Build blog pages from Strapi
        env:
          STRAPI_URL: https://nexgenio.com/cms
          STRAPI_TOKEN: ${{ secrets.STRAPI_READ_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/build-blog.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::124971231536:role/NexgenioPublicDeployRole
          aws-region: eu-central-1

      - name: Deploy blog to S3
        run: |
          aws s3 sync blog/ s3://nxg-web-public/blog/ \
            --delete --region eu-central-1

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2WWYNB9MTIF3N \
            --paths "/blog/*" --region us-east-1

      - name: Ping IndexNow
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.slug != ''
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          SLUG="${{ github.event.client_payload.slug }}"
          if [ -n "$SLUG" ] && [ -n "$INDEXNOW_KEY" ]; then
            curl -sf "https://api.indexnow.org/IndexNow?url=https://nexgenio.com/blog/${SLUG}.html&key=${INDEXNOW_KEY}" || true
          fi
