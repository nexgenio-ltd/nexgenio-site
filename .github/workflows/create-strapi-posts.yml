name: Create Strapi Blog Posts (one-time)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  create-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create and publish posts in Strapi
        env:
          STRAPI_URL: https://nexgenio.com/cms
          STRAPI_WRITE_TOKEN: ${{ secrets.STRAPI_WRITE_TOKEN || secrets.STRAPI_READ_TOKEN }}
        run: node scripts/create-posts.mjs

      - name: Trigger blog build and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering blog-build.yml to generate HTML, sitemap, RSS, and deploy..."
          gh workflow run blog-build.yml --repo ${{ github.repository }}
