name: Deploy to nexgenio.com

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (nxg-root)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.NXG_ROOT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.NXG_ROOT_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Sync to S3
        run: aws s3 sync . s3://nxg-site-public/ --delete --exclude ".git/*" --exclude ".github/*" --exclude "README.md"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2CENAXP7JGRVQ --paths "/*"
