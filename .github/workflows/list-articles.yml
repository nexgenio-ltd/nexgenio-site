name: List Strapi Articles (diagnostic)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List all articles (published + draft)
        env:
          STRAPI_URL: https://nexgenio.com/cms
          STRAPI_TOKEN: ${{ secrets.STRAPI_READ_TOKEN }}
        run: |
          echo "=== Published ==="
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "${STRAPI_URL}/api/articles?fields[0]=title&fields[1]=slug&fields[2]=publishedAt&pagination[pageSize]=100&sort=publishedDate:desc&status=published" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${STRAPI_TOKEN}")
          HTTP_CODE=$(echo "$RESP" | tail -1 | sed 's/HTTP_STATUS://')
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "$BODY" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for a in d.get('data',[]):
            print(f\"  {a.get('title','?')[:80]}\")
          print(f\"Total published: {len(d.get('data',[]))}\")"
          else
            echo "Response: $BODY" | head -5
          fi

          echo ""
          echo "=== Draft ==="
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "${STRAPI_URL}/api/articles?fields[0]=title&fields[1]=slug&fields[2]=publishedAt&pagination[pageSize]=100&sort=createdAt:desc&status=draft" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${STRAPI_TOKEN}")
          HTTP_CODE=$(echo "$RESP" | tail -1 | sed 's/HTTP_STATUS://')
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "$BODY" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for a in d.get('data',[]):
            print(f\"  {a.get('title','?')[:80]}\")
          print(f\"Total draft: {len(d.get('data',[]))}\")"
          else
            echo "Response: $BODY" | head -5
          fi
