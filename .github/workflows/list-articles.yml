name: List Strapi Articles (diagnostic)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: List all articles (published + draft)
        env:
          STRAPI_URL: https://nexgenio.com/cms
          STRAPI_TOKEN: ${{ secrets.STRAPI_READ_TOKEN }}
        run: |
          node -e '
          async function list(status) {
            const url = process.env.STRAPI_URL + "/api/articles?fields[0]=title&fields[1]=slug&fields[2]=publishedAt&pagination[pageSize]=100&sort=createdAt:desc&status=" + status;
            const headers = {"Content-Type":"application/json"};
            if (process.env.STRAPI_TOKEN) headers.Authorization = "Bearer " + process.env.STRAPI_TOKEN;
            const res = await fetch(url, {headers});
            console.log("=== " + status.toUpperCase() + " (HTTP " + res.status + ") ===");
            if (!res.ok) { console.log(await res.text().then(t=>t.substring(0,200))); return; }
            const json = await res.json();
            for (const a of json.data) {
              console.log("  " + (a.title || "?").substring(0,80) + " [slug=" + (a.slug||"?") + "]");
            }
            console.log("Total " + status + ": " + json.data.length);
          }
          await list("published");
          console.log("");
          await list("draft");
          '
