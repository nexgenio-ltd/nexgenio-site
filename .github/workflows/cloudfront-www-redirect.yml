name: CloudFront www to apex redirect

# Updates the single viewer-request function on the public distribution.
#
# CloudFront allows one viewer-request function per cache behavior, and
# `nexgenio-directory-index` already holds that slot. So the redirect is merged
# into that function rather than attached alongside it. This workflow therefore
# modifies an existing production function — it does not create a new one.
#
# Safety: the live code is compared against the committed revert target before
# anything is written, the new code is tested in DEVELOPMENT against five cases
# before publish, and the distribution itself is never modified.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DIST_ID: E2WWYNB9MTIF3N
  FN_NAME: nexgenio-directory-index
  SRC: infra/cloudfront/directory-index.js
  REVERT_TARGET: infra/cloudfront/directory-index.original.js

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::124971231536:role/NexgenioPublicDeployRole
          aws-region: us-east-1

      - name: Confirm the revert target still matches what is live
        run: |
          set -euo pipefail
          aws cloudfront get-function \
            --name "$FN_NAME" --stage LIVE --region us-east-1 /tmp/live.js

          # Compare code only — the committed copy carries an explanatory header.
          strip () { grep -v '^\s*//' "$1" | grep -v '^\s*$'; }
          if ! diff <(strip /tmp/live.js) <(strip "$REVERT_TARGET"); then
            echo "Live function does not match $REVERT_TARGET."
            echo "Someone changed it outside this workflow. Refusing to overwrite"
            echo "a version we cannot roll back to. Update the revert target first."
            exit 1
          fi
          echo "Live code matches the revert target. Safe to proceed."

      - name: Update the function in DEVELOPMENT
        run: |
          set -euo pipefail
          aws cloudfront describe-function --name "$FN_NAME" --region us-east-1 > /tmp/fn.json
          ETAG=$(jq -r '.ETag' /tmp/fn.json)
          RUNTIME=$(jq -r '.FunctionSummary.FunctionConfig.Runtime' /tmp/fn.json)
          COMMENT=$(jq -r '.FunctionSummary.FunctionConfig.Comment' /tmp/fn.json)
          echo "Updating $FN_NAME (runtime $RUNTIME, ETag $ETAG)"

          aws cloudfront update-function \
            --name "$FN_NAME" \
            --function-config "$(jq -nc --arg c "$COMMENT" --arg r "$RUNTIME" \
                 '{Comment:$c, Runtime:$r}')" \
            --function-code "fileb://$SRC" \
            --if-match "$ETAG" \
            --region us-east-1 > /dev/null
          echo "DEVELOPMENT stage updated. Not live yet."

      - name: Test five cases before publishing
        run: |
          set -euo pipefail
          ETAG=$(aws cloudfront describe-function --name "$FN_NAME" --stage DEVELOPMENT \
                 --region us-east-1 | jq -r '.ETag')

          run_case () {
            local label="$1" host="$2" uri="$3" qs="$4"
            jq -nc --arg h "$host" --arg u "$uri" --argjson q "$qs" '{
              version: "1.0",
              context: { eventType: "viewer-request" },
              viewer: { ip: "1.2.3.4" },
              request: {
                method: "GET", uri: $u, querystring: $q,
                headers: { host: { value: $h } }, cookies: {}
              }
            }' > /tmp/event.json

            aws cloudfront test-function \
              --name "$FN_NAME" --stage DEVELOPMENT --if-match "$ETAG" \
              --event-object fileb:///tmp/event.json --region us-east-1 \
              | jq -r '.TestResult.FunctionOutput' > /tmp/out.json
            echo "--- $label"
            cat /tmp/out.json
          }

          run_case "1. www redirects, querystring preserved" \
                   "www.nexgenio.com" "/self/iso-27001-lead-implementer/" \
                   '{"utm_source":{"value":"li"}}'
          jq -e '.response.statusCode == 301' /tmp/out.json > /dev/null
          jq -e '.response.headers.location.value ==
                 "https://nexgenio.com/self/iso-27001-lead-implementer/?utm_source=li"' /tmp/out.json > /dev/null

          run_case "2. www root redirects with no stray question mark" \
                   "www.nexgenio.com" "/" '{}'
          jq -e '.response.headers.location.value == "https://nexgenio.com/"' /tmp/out.json > /dev/null

          run_case "3. apex directory still gets index.html appended" \
                   "nexgenio.com" "/self/iso-27001-lead-implementer/" '{}'
          jq -e 'has("response") | not' /tmp/out.json > /dev/null
          jq -e '.request.uri == "/self/iso-27001-lead-implementer/index.html"' /tmp/out.json > /dev/null

          run_case "4. apex file path is left alone" \
                   "nexgenio.com" "/blog/some-post.html" '{}'
          jq -e 'has("response") | not' /tmp/out.json > /dev/null
          jq -e '.request.uri == "/blog/some-post.html"' /tmp/out.json > /dev/null

          run_case "5. any other host keeps the original behaviour" \
                   "d1234.cloudfront.net" "/training/" '{}'
          jq -e 'has("response") | not' /tmp/out.json > /dev/null
          jq -e '.request.uri == "/training/index.html"' /tmp/out.json > /dev/null

          echo "All five cases pass."

      - name: Confirm this function is the one already attached
        run: |
          set -euo pipefail
          ARN=$(aws cloudfront describe-function --name "$FN_NAME" --stage LIVE --region us-east-1 \
                | jq -r '.FunctionSummary.FunctionMetadata.FunctionARN')
          aws cloudfront get-distribution-config --id "$DIST_ID" --region us-east-1 \
            | jq '.DistributionConfig' > /tmp/config.json

          ATTACHED=$(jq -r --arg arn "$ARN" '
            [ (.DefaultCacheBehavior.FunctionAssociations.Items // [])[]
              | select(.EventType == "viewer-request")
              | select(.FunctionARN == $arn) ] | length' /tmp/config.json)

          if [ "$ATTACHED" != "1" ]; then
            echo "$FN_NAME is not the attached viewer-request function. Stopping."
            jq '.DefaultCacheBehavior.FunctionAssociations' /tmp/config.json
            exit 1
          fi
          echo "Already attached. Publishing will take effect without touching the distribution."

      - name: Publish to LIVE
        run: |
          set -euo pipefail
          ETAG=$(aws cloudfront describe-function --name "$FN_NAME" --stage DEVELOPMENT \
                 --region us-east-1 | jq -r '.ETag')
          aws cloudfront publish-function --name "$FN_NAME" --if-match "$ETAG" --region us-east-1 > /dev/null
          echo "Published. Propagation takes a few minutes."

      - name: Verify against the live site
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' https://www.nexgenio.com/)
            [ "$CODE" = "301" ] && break
            echo "attempt $i: www still returns $CODE, waiting"
            sleep 15
          done

          echo "--- www.nexgenio.com/"
          curl -sSI https://www.nexgenio.com/ | tee /tmp/www.txt
          grep -qi '^HTTP/2 301' /tmp/www.txt
          grep -qi '^location: https://nexgenio.com/' /tmp/www.txt

          echo "--- nexgenio.com/ must still serve the page"
          curl -sSI https://nexgenio.com/ | tee /tmp/apex.txt
          grep -qi '^HTTP/2 200' /tmp/apex.txt

          echo "--- a directory URL must still resolve, not 404"
          curl -sSI https://nexgenio.com/training/ | tee /tmp/dir.txt
          grep -qi '^HTTP/2 200' /tmp/dir.txt

          echo "--- deep www path keeps its querystring"
          curl -sSI "https://www.nexgenio.com/training/?utm_source=li" | tee /tmp/deep.txt
          grep -qi '^location: https://nexgenio.com/training/?utm_source=li' /tmp/deep.txt

          echo "Verified."
